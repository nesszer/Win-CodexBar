name: Build fixed binaries

on:
  push:
    branches: [fix/devin-quota-endpoint]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop-tauri

      - name: Build desktop app (no bundle)
        run: pnpm run tauri:build
        working-directory: apps/desktop-tauri

      - name: Build CLI
        run: cargo build --release -p codexbar

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $desktop = "target\release\codexbar-desktop-tauri.exe"
          $cli = "target\release\codexbar.exe"
          if (-not (Test-Path $desktop)) { throw "desktop binary missing: $desktop" }
          if (-not (Test-Path $cli)) { throw "cli binary missing: $cli" }
          Copy-Item $desktop artifacts\codexbar.exe
          Copy-Item $cli artifacts\codexbar-cli.exe
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: codexbar-fixed-binaries
          path: artifacts/
          if-no-files-found: error
