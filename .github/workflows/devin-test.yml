name: Devin fix tests (temporary)

on:
  push:
    branches: [fix/devin-quota-endpoint]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Run devin provider tests
        run: cargo test -p codexbar devin
      - name: Run core unit tests
        run: cargo test -p codexbar --lib
